openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/products:
    get:
      summary: Ambil daftar produk
      description: >
        Mengambil daftar produk dengan pagination, filter kategori,
        pencarian nama, dan pengurutan.
        Memerlukan token Sanctum dengan ability products:read.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter berdasarkan ID kategori yang tersedia.
          schema:
            type: integer
            minimum: 1
          example: 2
        - name: q
          in: query
          required: false
          description: Pencarian berdasarkan nama produk, minimal 2 karakter.
          schema:
            type: string
            minLength: 2
          example: keyboard
        - name: sort
          in: query
          required: false
          description: Pengurutan berdasarkan nama atau harga.
          schema:
            type: string
            enum:
              - name
              - -name
              - price
              - -price
            default: name
          example: "-price"
        - name: per_page
          in: query
          required: false
          description: Jumlah produk per halaman, antara 1 sampai 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
          example: 5
        - name: page
          in: query
          required: false
          description: Nomor halaman pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
      responses:
        '200':
          description: Daftar produk berhasil diambil dengan pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        category:
                          type: string
                          nullable: true
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            active:
                              type: boolean
                      path:
                        type: string
                      per_page:
                        type: integer
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
              example:
                data:
                  - id: 1
                    name: Keyboard Gaming
                    price: 250000
                    category: Aksesoris
                links:
                  first: "http://127.0.0.1:8000/api/products?page=1"
                  last: "http://127.0.0.1:8000/api/products?page=3"
                  prev: null
                  next: "http://127.0.0.1:8000/api/products?page=2"
                meta:
                  current_page: 1
                  from: 1
                  last_page: 3
                  path: "http://127.0.0.1:8000/api/products"
                  per_page: 5
                  to: 5
                  total: 12
        '401':
          description: Token tidak tersedia atau tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Token tidak memiliki ability products:read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Parameter query tidak memenuhi aturan validasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '429':
          description: Batas permintaan API terlampaui, yaitu 60 request per menit per pengguna atau IP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
