openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/products:
    get:
      summary: Ambil daftar produk (paginasi, filter, dan sort)
      description: >
        Daftar dipaginasi (default 15 per halaman, maksimal 100).
        Token wajib memiliki ability products:read.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter berdasarkan id kategori (harus ada di tabel categories)
          schema: { type: integer }
        - name: q
          in: query
          required: false
          description: Cari berdasarkan nama produk (minimal 2 karakter)
          schema: { type: string, minLength: 2 }
        - name: sort
          in: query
          required: false
          description: Urutan hasil. Awalan minus berarti menurun.
          schema:
            type: string
            enum: [name, -name, price, -price]
            default: name
        - name: per_page
          in: query
          required: false
          description: Jumlah produk per halaman (1 sampai 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          required: false
          description: Nomor halaman
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar produk berpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }
                  links:
                    type: object
                    properties:
                      first: { type: string, nullable: true }
                      last: { type: string, nullable: true }
                      prev: { type: string, nullable: true }
                      next: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      from: { type: integer, nullable: true }
                      last_page: { type: integer }
                      path: { type: string }
                      per_page: { type: integer }
                      to: { type: integer, nullable: true }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '403':
          description: Token tidak memiliki ability products:read
        '422':
          description: Parameter query tidak valid, misalnya per_page lebih dari 100
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
  /api/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
